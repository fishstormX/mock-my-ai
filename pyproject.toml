[project]
name = "mock-my-ai"
version = "0.1.0"
description = "Open-source mock AI API server compatible with OpenAI, Anthropic, and Gemini — corpus replies, SSE, agent tool loops, web console"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "fishstormX", email = "stormnetwork@163.com" }]
keywords = ["mock", "ai", "openai", "anthropic", "gemini", "fastapi", "sse", "codex"]
urls = { Homepage = "https://aimock.fishmaple.cn", Repository = "https://github.com/fishstormX/mock-my-ai", Issues = "https://github.com/fishstormX/mock-my-ai/issues" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "langdetect>=1.0.9",
    "tiktoken>=0.8.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.2.0",
    "bcrypt>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
mock-my-ai = "mock_my_ai.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_my_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
