site_name: Mock My AI
site_description: Mock OpenAI, Anthropic, and Gemini compatible AI APIs
site_url: https://example.com/mock-my-ai
repo_url: https://github.com/example/mock-my-ai
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Configuration: guides/configuration.md
  - Models: guides/models.md
  - Corpus & Languages: guides/corpus.md
  - Tools: guides/tools.md
  - API:
      - OpenAI Compatible: api/openai.md
      - Anthropic Compatible: api/anthropic.md
      - Gemini Compatible: api/gemini.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true
